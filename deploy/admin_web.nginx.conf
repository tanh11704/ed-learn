server {
    listen 80;
    listen [::]:80;
    server_name admin.phuocanh.me;

    root /var/www/admin.phuocanh.me;
    index index.html;

    access_log /var/log/nginx/admin.phuocanh.me.access.log;
    error_log /var/log/nginx/admin.phuocanh.me.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
